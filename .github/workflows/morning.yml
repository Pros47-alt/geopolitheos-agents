name: Morning briefing

# Manual only. This workflow calls the paid Anthropic API, so it has no daily
# schedule. The live 6pm briefing runs as a Claude scheduled task on the
# Claude plan instead. To schedule it again, add back:
#   schedule:
#     - cron: "0 3 * * *"
on:
  workflow_dispatch: {}

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the newsroom
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python run.py morning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing-${{ github.run_id }}
          path: out/
